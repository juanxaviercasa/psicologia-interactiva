<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libros Interactivos | Sistema Zenit</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              cyan: '#06B6D4',
              emerald: '#10B981',
              amber: '#F59E0B',
              rose: '#F43F5E',
              purple: '#8B5CF6',
              dark: '#090D16',
              card: '#0F172A',
              border: '#1E293B'
            }
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    .glass-nav {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(30, 41, 59, 0.8);
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

  <!-- TOP NAV -->
  <nav class="glass-nav fixed top-0 w-full z-50 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-cyan to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
            <i class="fa-solid fa-book-open-reader text-white text-lg"></i>
          </div>
          <div>
            <h1 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-tight flex items-center gap-2">
              LIBROS INTERACTIVOS
            </h1>
            <p class="text-[10px] text-slate-400 font-mono tracking-widest uppercase">Sistema de Aprendizaje</p>
          </div>
        </div>
        <div class="hidden sm:block">
           <button class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-lg border border-slate-700 transition-colors">
              <i class="fa-solid fa-user mr-1.5"></i> Mi Cuenta
           </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <main class="flex-grow pt-24 pb-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
    <div class="mb-10 text-center">
      <h2 class="text-3xl sm:text-4xl font-black text-white mb-3 tracking-tight">Tu Biblioteca <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Interactiva</span></h2>
      <p class="text-slate-400 text-sm sm:text-base max-w-2xl mx-auto">
        Explora la colección completa. Haz clic en cualquier libro para acceder a su ecosistema de aprendizaje con resúmenes, simuladores, audios y flashcards.
      </p>
    </div>

    <!-- CATALOG GRID -->
    <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- El contenido se generará con JS -->
    </div>
  </main>

  <footer class="py-8 border-t border-slate-800 text-center text-slate-500 text-xs mt-auto">
    <p>&copy; 2026 Sistema Zenit. Todos los derechos reservados.</p>
  </footer>

  <!-- Scripts -->
  <script src="js/coleccion_data.js?v=1.0"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById('catalog-grid');
      
      if (typeof COLECCION_DATA === 'undefined' || !COLECCION_DATA.books) {
        container.innerHTML = `<div class="col-span-full text-center py-20 text-slate-400"><i class="fa-solid fa-triangle-exclamation text-3xl mb-3"></i><p>Error cargando la colección.</p></div>`;
        return;
      }
      
      const books = COLECCION_DATA.books;
      
      let html = '';
      books.forEach(book => {
        // Enlace al motor interactivo con el ID del libro
        const appUrl = `app.html?book=${book.id}`;
        
        html += `
          <a href="${appUrl}" class="group relative rounded-2xl bg-gradient-to-b ${book.gradient || 'from-slate-900 to-slate-950'} border border-slate-800/80 hover:border-cyan-500/50 p-5 flex flex-col justify-between transition-all duration-300 hover:-translate-y-1 shadow-lg hover:shadow-cyan-500/10 cursor-pointer block">
            <div>
              <div class="flex items-start justify-between gap-2 mb-3">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-[10px] font-mono font-bold rounded-lg ${book.badgeBg || 'bg-slate-800 text-slate-300'}">
                  <i class="fa-solid ${book.categoryIcon || 'fa-book'}"></i> ${book.categoryName || 'Libro'}
                </span>
              </div>

              <div class="my-4 h-40 rounded-xl bg-slate-950/80 border border-slate-800 flex items-center justify-center relative overflow-hidden group-hover:border-cyan-500/40 transition-all">
                ${book.coverImage ? `
                  <img src="${book.coverImage}" alt="${book.title}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 z-0" onerror="this.remove()">
                ` : ''}
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent z-10 pointer-events-none"></div>
                <i class="fa-solid ${book.categoryIcon || 'fa-book'} text-5xl text-slate-700 group-hover:text-cyan-400 group-hover:scale-110 transition-all duration-500 z-0"></i>
              </div>

              <h3 class="text-sm font-bold text-white group-hover:text-cyan-300 transition-colors line-clamp-2 leading-snug min-h-[2.5rem]">
                ${book.title}
              </h3>
              <p class="text-xs text-slate-400 mt-1 flex items-center gap-1.5 truncate">
                <i class="fa-solid fa-pen-nib text-slate-500 text-[10px]"></i> ${book.author}
              </p>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center gap-2">
               <div class="flex-1 py-2 px-3 rounded-xl bg-cyan-950/80 group-hover:bg-cyan-500 group-hover:text-slate-950 text-cyan-300 border border-cyan-500/40 text-xs font-semibold flex items-center justify-center gap-1.5 transition-all shadow-sm">
                 <i class="fa-solid fa-rocket text-xs"></i>
                 <span>Abrir Plataforma</span>
               </div>
            </div>
          </a>
        `;
      });
      
      container.innerHTML = html;
    });
  </script>
</body>
</html>
