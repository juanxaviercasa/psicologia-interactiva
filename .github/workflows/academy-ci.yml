name: Verificación de la academia
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis del código principal
        run: |
          node --check js/course_manifest.js
          node --check js/quiz_factory.js
          node --check js/progress_backup.js
          node --check js/app.js
          node --check js/ai_engine.js
          node --check js/cv_engine.js
          node --check js/audioplayer_engine.js
          node --check js/biblioteca_engine.js
          node --check js/coleccion_data.js
      - name: Ejecutar pruebas sin dependencias
        run: node --test tests/*.test.cjs
