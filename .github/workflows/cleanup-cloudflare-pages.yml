name: Limpiar despliegues antiguos de Cloudflare Pages

on:
  schedule:
    # 03:00 America/Lima (UTC-5; Lima no usa horario de verano).
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Eliminar despliegues antiguos
        env:
          CLOUDFLARE_ACCOUNT_ID: 692c72d413cf8bb41692d7d145601014
          CLOUDFLARE_PAGES_PROJECT: psicologia-interactiva
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_CLEANUP_TOKEN }}
        run: node scripts/cleanup-cloudflare-pages.mjs
