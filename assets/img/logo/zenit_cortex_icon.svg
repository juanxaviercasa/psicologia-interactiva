<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Neon Cyber Gradient: Cyan to Indigo -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="45%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <linearGradient id="coreGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.3" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle with Subtle Neon Border -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="1.8" stroke-opacity="0.6" />

  <!-- Tactical Outer Shield Silhouette -->
  <path d="M50 14 L78 26 V48 C78 66 66 81 50 87 C34 81 22 66 22 48 V26 Z" 
        fill="none" 
        stroke="url(#neonGrad)" 
        stroke-width="1.5" 
        stroke-opacity="0.35" 
        stroke-dasharray="2 3" />

  <!-- Inner Strategic Chevron (Zenit Ascent) -->
  <path d="M50 20 L72 30 V46 C72 61 62 73 50 78 C38 73 28 61 28 46 V30 Z" 
        fill="url(#coreGlow)" 
        fill-opacity="0.12" 
        stroke="url(#neonGrad)" 
        stroke-width="2.4" 
        filter="url(#glow)" />

  <!-- Cortex Neural Synapses & Tactical Nodes -->
  <!-- Left Hemisphere Circuit (Perception / Analysis) -->
  <path d="M48 30 C42 30 36 34 36 41 C36 45 38 48 42 50 C38 52 35 56 36 61 C37 65 41 68 47 69" 
        fill="none" 
        stroke="url(#neonGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <path d="M48 38 C44 38 42 41 42 44 C42 47 45 49 48 51" 
        fill="none" 
        stroke="#22D3EE" 
        stroke-width="2" 
        stroke-linecap="round" />

  <!-- Right Hemisphere Circuit (Execution / Defense) -->
  <path d="M52 30 C58 30 64 34 64 41 C64 45 62 48 58 50 C62 52 65 56 64 61 C63 65 59 68 53 69" 
        fill="none" 
        stroke="url(#neonGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <path d="M52 38 C56 38 58 41 58 44 C58 47 55 49 52 51" 
        fill="none" 
        stroke="#818CF8" 
        stroke-width="2" 
        stroke-linecap="round" />

  <!-- Central Zenit Axis (Clarity / Shield Spine) -->
  <line x1="50" y1="26" x2="50" y2="72" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)" />

  <!-- Tactical Neural Nodes -->
  <circle cx="50" cy="26" r="3.2" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="50" cy="46" r="2.8" fill="#22D3EE" filter="url(#glow)" />
  <circle cx="50" cy="66" r="3" fill="#6366F1" filter="url(#glow)" />

  <!-- Cross-hemisphere connecting bridges -->
  <line x1="42" y1="50" x2="58" y2="50" stroke="url(#neonGrad)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
</svg>
